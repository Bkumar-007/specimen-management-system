server:
  # Render/Railway set PORT; local default remains 8080
  port: ${PORT:8080}

spring:
  application:
    name: specimen-management
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    # Existing Neon DBs created under ddl-auto:update get baselined so V1 is not re-run
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    demo-users: ${SEED_DEMO_USERS:true}
  instrument:
    # Header value for POST /api/instruments/ingest when no user JWT is sent. Override in production.
    api-key: ${INSTRUMENT_API_KEY:sim-analyzer-key}
    inbox:
      # Drop *.json analyzer messages into this folder to post results automatically.
      enabled: ${INSTRUMENT_INBOX_ENABLED:false}
      directory: ${INSTRUMENT_INBOX_DIR:inbox}
      poll-ms: 3000

logging:
  level:
    org.springframework.security: INFO
